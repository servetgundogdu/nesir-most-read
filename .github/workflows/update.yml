
name: Update Nesir Most Read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect article statistics
        run: python update_stats.py

      - name: Save updated ranking
        run: |
          if [ -f most_read.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add article_ids.json most_read.json statistics_history.json
            if ! git diff --cached --quiet; then
              git commit -m "Update most-read article statistics"
              git push
            fi
          fi
